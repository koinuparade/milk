<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おふみ乳業">
<meta name="theme-color" content="#f6f4ef">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>おふみ乳業</title>
<style>html,body{margin:0;background:#f6f4ef;color:#6b7079;font-family:-apple-system,sans-serif}#m{padding:40px 16px;text-align:center;font-size:14px}</style>
</head>
<body>
<div id="m">読み込み中…</div>
<script>
(async()=>{
  const m=document.getElementById('m');
  try{
    const r=await fetch('app.html?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const html=await r.text();
    try{localStorage.setItem('milkapp.lastapp',html);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    let cached=null;try{cached=localStorage.getItem('milkapp.lastapp');}catch(x){}
    if(cached){document.open();document.write(cached);document.close();}
    else m.textContent='アプリ本体を取得できない。電波を確認して開き直す。('+e.message+')';
  }
})();
</script>
</body>
</html>
